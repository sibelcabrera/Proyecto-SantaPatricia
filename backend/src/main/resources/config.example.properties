# =====================================================================
#  PLANTILLA DE CONFIGURACIÓN DEL BACKEND
#  Copia este archivo como "config.properties" (en esta misma carpeta)
#  y cambia tu contraseña de MySQL y la clave del JWT.
#  config.properties NO se sube a GitHub (está en .gitignore).
# =====================================================================

# --- Base de datos MySQL ---
# sslMode=DISABLED: MySQL está en la misma PC, no hace falta cifrar la conexión
#   (además, dentro de GlassFish el cifrado choca con los certificados del servidor).
# allowPublicKeyRetrieval=true: necesario en MySQL 8 cuando la conexión no va cifrada.
db.url=jdbc:mysql://localhost:3306/santapatricia_db?serverTimezone=America/Lima&sslMode=DISABLED&allowPublicKeyRetrieval=true
db.usuario=root
db.password=root

# --- Token de sesión (JWT) ---
# Horas que dura una sesión antes de pedir login otra vez (un turno = 8 h)
jwt.horas=8
# Clave secreta para firmar los tokens (32 caracteres o más).
jwt.clave=CAMBIAR-por-una-clave-propia-de-32-caracteres-o-mas

# --- Bloqueo por intentos fallidos (HU01) ---
login.max.intentos=5
login.minutos.bloqueo=15

# --- Direcciones del frontend React que pueden usar la API (CORS) ---
cors.origenes=http://localhost:5173,http://localhost:3000
